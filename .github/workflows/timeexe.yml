name: Build TimeCommand Exe and Sign

on:
  workflow_dispatch:                # 允许手动触发
  push:
    branches: [ main ]              # 推送 main 时自动触发（可选）

permissions:
  contents: read                    # 最小权限，只读代码

concurrency:
  group: vsign-code-signing         # 与原模板共用同一并发组，保护签名资源
  cancel-in-progress: false

jobs:
  build-sign:
    runs-on: windows-2022
    environment: release-signing    # 必须指定，以便读取签名相关的 vars 和 secrets
    timeout-minutes: 30

    steps:
      # 1. 检出代码（因为要引用本地 action: ./.github/actions/vsign-sign）
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      # 2. 安装 .NET 8 SDK
      - name: Set up .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      # 3. 动态生成 C# 源文件（显示当前时间）
      - name: Create source code
        shell: pwsh
        run: |
          @"
          using System;

          namespace TimeApp
          {
              class Program
              {
                  static void Main()
                  {
                      Console.WriteLine($"Current system time: {DateTime.Now}");
                      Console.WriteLine("Press any key to exit...");
                      Console.ReadKey();
                  }
              }
          }
          "@ | Out-File -FilePath Program.cs -Encoding utf8

      # 4. 创建 .csproj 项目文件
      - name: Create project file
        shell: pwsh
        run: |
          @"
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net8.0</TargetFramework>
              <RuntimeIdentifier>win-x64</RuntimeIdentifier>
              <PublishSingleFile>true</PublishSingleFile>
              <SelfContained>false</SelfContained>
            </PropertyGroup>
          </Project>
          "@ | Out-File -FilePath TimeApp.csproj -Encoding utf8

      # 5. 发布生成 .exe（输出到 dist 文件夹）
      - name: Build Windows executable
        shell: pwsh
        run: |
          dotnet publish TimeApp.csproj --configuration Release --runtime win-x64 --self-contained false --output dist
          if (!(Test-Path -LiteralPath "dist\TimeApp.exe")) {
            throw "Build output not found"
          }

      # 6. 调用您已有的签名 Action 对 exe 进行数字签名
      - name: Sign Windows executable
        id: vsign
        uses: ./.github/actions/vsign-sign
        with:
          input-file: dist\TimeApp.exe
          output-file: dist\TimeApp-signed.exe
          server: ${{ vars.VSIGN_SERVER }}
          signing-cert-sha1: ${{ vars.VSIGN_CERT_HASH }}
          operator-cert-sha1: ${{ vars.VSIGN_OPERATOR_SHA1 }}
          tool-release: ${{ vars.VSIGN_TOOL_RELEASE }}
          tool-sha256: ${{ vars.VSIGN_TOOL_SHA256 }}
          operator-pfx-base64: ${{ secrets.VSIGN_OPERATOR_PFX_B64 }}
          operator-pfx-password: ${{ secrets.VSIGN_OPERATOR_PWD }}
          key-pin: ${{ secrets.VSIGN_KEY_PIN }}
          github-token: ${{ github.token }}

      # 7. 运行签名后的 exe，验证其功能（打印时间并等待按键，需模拟按键退出，以防挂起）
      - name: Run signed executable test
        shell: pwsh
        run: |
          # 由于程序需要按键退出，我们用 Start-Process 启动并等待 2 秒后强制终止，只捕获输出
          $process = Start-Process -FilePath "dist\TimeApp-signed.exe" -PassThru -RedirectStandardOutput output.txt
          Start-Sleep -Seconds 2
          Stop-Process -Id $process.Id -Force
          $output = Get-Content output.txt
          Write-Host "Signed exe output:"
          Write-Host $output
          if ($output -notmatch "Current system time:") {
            throw "Signed exe did not output expected time string"
          }

      # 8. 上传签名后的 exe 作为制品
      - name: Upload signed artifact
        uses: actions/upload-artifact@v7
        with:
          name: TimeApp-windows-x64-signed
          path: dist/TimeApp-signed.exe
          if-no-files-found: error
